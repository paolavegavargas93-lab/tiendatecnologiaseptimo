<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TecnoTienda Pro | Hardware 7°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070714;--p1:#0d0d22;--p2:#131330;--ln:#26264d;--cy:#00e5ff;--mg:#ff2bd6;--vi:#9d6bff;--ok:#38f59a;--bad:#ff5470;--am:#ffd166;--tx:#ecebff;--mu:#a6a6d4;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 19px/1.45 'Rajdhani',system-ui,sans-serif;min-height:100vh;
  background-image:linear-gradient(rgba(157,107,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(157,107,255,.05) 1px,transparent 1px);background-size:40px 40px;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--mg);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.btn{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.04em;padding:.95em 1.4em;border-radius:10px;border:2px solid var(--cy);background:transparent;color:var(--cy);min-height:48px}
.btn.pri{background:var(--cy);color:#04101a;box-shadow:0 0 18px rgba(0,229,255,.35)}
.btn:disabled{opacity:.35}
.btn:not(:disabled):hover{filter:brightness(1.15)}
.link{background:none;border:0;color:var(--mu);font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--tx)}

/* Ingreso */
.login{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 40px;text-align:center}
.sign{width:100%;height:auto;display:block}
.flick{animation:flick 1.6s steps(1) 1 both}
@keyframes flick{0%{opacity:.1}8%{opacity:1}12%{opacity:.2}20%{opacity:1}26%{opacity:.4}30%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.flick{animation:none}}
.lead{color:var(--mu);font-size:1.12rem;margin:18px auto 22px;max-width:44ch}
.login-card{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:22px;text-align:left;display:grid;gap:14px}
.login-card label{display:grid;gap:6px;font-weight:700}
input{font:inherit;font-size:1.1rem;color:var(--tx);background:#090920;border:2px solid var(--ln);border-radius:10px;padding:12px 14px;min-height:50px;width:100%}
input:focus{border-color:var(--cy);outline:none;box-shadow:0 0 0 3px rgba(0,229,255,.25)}
.lmsg{margin:0;color:var(--am);min-height:1.4em;font-size:1rem}
.pie{color:#6f6fa0;font-size:.88rem;margin-top:22px}

/* Barra superior */
.hud{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:#0a0a1c;border-bottom:1px solid var(--ln)}
.hud-marca{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.6);font-size:.95rem;margin-right:auto}
.hud-user{display:flex;flex-direction:column;line-height:1.1}
.hud-user span{color:var(--mu);font-size:.85rem}
.hud-coins{display:flex;align-items:center;gap:6px;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--am)}
.hud-coins svg{width:22px;height:22px}
.save{font-size:.88rem;display:flex;align-items:center;gap:6px;color:var(--mu);font-weight:600}
.save::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.save.saving::before{background:var(--am)}
.save.error{color:var(--bad)}.save.error::before{background:var(--bad)}
.save.demo::before{background:var(--vi)}
.icon-btn{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;min-height:40px;font-weight:700}

/* Mostrador y burbujas */
.mostrador,.escena{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:end;margin:10px 0 20px}
.escena{grid-template-columns:160px 1fr;margin:20px 0}
.ava{width:100%;height:auto;display:block}
.burbuja{position:relative;background:var(--p2);border:2px solid var(--vi);border-radius:18px;padding:14px 20px}
.burbuja::before{content:"";position:absolute;left:-12px;bottom:26px;border:10px solid transparent;border-right-color:var(--vi);border-left:0}
.burbuja p{margin:.2em 0 .8em;font-size:1.14rem;max-width:64ch}
.burbuja p:last-child{margin-bottom:.2em}
.quien{font-weight:700;color:var(--mg);font-size:.95rem}
@media(max-width:600px){.mostrador,.escena{grid-template-columns:78px 1fr;gap:12px}}
.prog{display:flex;align-items:center;gap:12px;color:var(--mu);font-weight:600;margin-bottom:24px}
.bar{flex:1;height:10px;background:#15153a;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy))}

/* Estantes (misiones) */
.sec-t{font-size:1rem;color:var(--mu);margin:0 0 12px}
.estantes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.estante{display:grid;gap:6px;text-align:left;background:var(--p1);border:1px solid var(--ln);border-bottom:6px solid var(--vi);border-radius:12px 12px 6px 6px;padding:16px}
.est-ico{width:64px;height:64px;color:var(--cy)}
.est-ico svg{width:100%;height:100%}
.est-n{font-size:.88rem;color:var(--mu);font-weight:700}
.est-t{font-family:'Orbitron',sans-serif;font-weight:700;font-size:.95rem;line-height:1.25}
.est-c{color:var(--mu);font-size:.98rem}
.est-bar{height:6px;background:#15153a;border-radius:4px;overflow:hidden}
.est-bar i{display:block;height:100%;background:var(--cy)}
.est-l{font-size:.92rem;font-weight:700;color:var(--cy)}
.estante.hecha{border-bottom-color:var(--ok)}
.estante.hecha .est-l,.estante.hecha .est-ico{color:var(--ok)}
.estante.hecha .est-bar i{background:var(--ok)}
.estante.cerrada{opacity:.45}
.estante.cerrada .est-ico,.estante.cerrada .est-l{color:var(--mu)}
.estante.abierta:hover,.estante.hecha:hover{border-color:var(--cy)}

/* Barra de misión */
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
.mbar-t{display:flex;flex-direction:column;margin-right:auto}
.mbar-t span{color:var(--mu);font-size:.88rem;font-weight:700}
.mbar-t b{font-family:'Orbitron',sans-serif;font-size:1rem}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ln)}
.dot.cur{border-color:var(--cy);box-shadow:0 0 8px var(--cy)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.mal{background:var(--bad);border-color:var(--bad)}

/* Manual */
.manual{background:var(--p1);border:1px solid var(--ln);border-left:6px solid var(--cy);border-radius:var(--r);padding:22px 24px}
.man-head{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.man-ico{width:68px;height:68px;color:var(--cy);flex:none}
.man-ico svg{width:100%;height:100%}
.man-pag{color:var(--mu);font-size:.92rem;font-weight:700}
.manual h2{font-size:1.2rem;color:var(--cy)}
.manual p{font-size:1.17rem;max-width:66ch;margin:.6em 0}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:14px 0 0}
.fichas div{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.fichas dt{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--mg);font-size:.9rem;margin-bottom:4px}
.fichas dd{margin:0;font-size:1.07rem}
.acciones{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}

/* Retos */
.reto-head{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:end;margin-bottom:16px}
@media(max-width:600px){.reto-head{grid-template-columns:64px 1fr;gap:10px}}
.zona{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.ayuda{color:var(--mu);margin:0 0 12px;font-size:1.02rem}
.ops{display:grid;gap:10px}
.op{text-align:left;background:var(--p2);border:2px solid var(--ln);border-radius:12px;padding:14px 16px;font-size:1.13rem;font-weight:600;min-height:56px}
.op:not(:disabled):hover{border-color:var(--vi)}
.op.sel{border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,255,.2)}
.op.bien{border-color:var(--ok);background:rgba(56,245,154,.12)}
.op.mal{border-color:var(--bad);background:rgba(255,84,112,.1);text-decoration:line-through;opacity:.7}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:10px;align-content:start}
.mi{position:relative;text-align:left;background:var(--p2);border:2px solid var(--ln);border-radius:12px;padding:12px 12px 12px 48px;font-size:1.06rem;font-weight:600;min-height:56px}
.mi .tag{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:.75rem;border:2px solid var(--ln);color:var(--mu)}
.mi.sel{border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,255,.25)}
.mi.par{border-color:var(--c)}
.mi.par .tag{background:var(--c);border-color:var(--c);color:#06061a}
.mi.bien{border-color:var(--ok)}
.mi.bien .tag{background:var(--ok);border-color:var(--ok);color:#06061a}
@media(max-width:560px){.mi{font-size:.98rem;padding-left:44px}.match{gap:8px}}
.slots{list-style:none;padding:0;margin:0 0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.slot{width:100%;min-height:64px;display:flex;align-items:center;gap:10px;background:#0a0a1e;border:2px dashed var(--ln);border-radius:12px;padding:10px 12px;font-weight:700;font-size:1.06rem;text-align:left}
.slot:not(.vacio){border-style:solid;border-color:var(--cy);background:var(--p2)}
.slot.bien{border-color:var(--ok)}
.sn{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--mu)}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.chip{background:var(--p2);border:2px solid var(--vi);border-radius:999px;padding:10px 18px;font-weight:700;font-size:1.06rem;min-height:48px}
.clasif{display:grid;gap:8px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--p2);border:2px solid transparent;border-radius:12px;padding:10px 12px}
.fila-t{font-weight:700;font-size:1.1rem}
.fila.bien{border-color:var(--ok)}
.fila.mal{border-color:var(--bad)}
.seg{display:flex;gap:6px}
.seg button{background:#0a0a1e;border:2px solid var(--ln);border-radius:9px;padding:8px 14px;font-weight:700;min-height:44px}
.seg button.sel{border-color:var(--cy);background:rgba(0,229,255,.15);color:var(--cy)}
.fila.bien .seg button.sel{border-color:var(--ok);color:var(--ok);background:rgba(56,245,154,.12)}
.num{display:flex;align-items:center;gap:12px;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--mu)}
.num input{max-width:200px;font-family:'Orbitron',sans-serif;font-size:1.5rem;text-align:center}
input.bien{border-color:var(--ok)}
input.mal{border-color:var(--bad)}

/* Armar pedido */
.build{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.grupo{border:0;padding:0;margin:0 0 14px;min-width:0}
.grupo legend{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--mg);font-size:.9rem;margin-bottom:8px;padding:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pieza{display:grid;gap:2px;text-align:left;background:var(--p2);border:2px solid var(--ln);border-radius:10px;padding:10px 12px}
.pieza b{font-size:1.06rem}
.pieza small{color:var(--mu);font-size:.92rem}
.pieza .precio{color:var(--am);font-weight:700}
.pieza.sel{border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,255,.2)}
.resumen{background:#0a0a1e;border:2px solid var(--vi);border-radius:var(--r);padding:16px;position:sticky;top:80px}
.resumen h3{font-size:.95rem;color:var(--vi);margin-bottom:10px}
.resumen h4{font-size:.85rem;color:var(--mu);margin:14px 0 8px}
.linea{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #22224a;font-size:1rem}
.linea b{white-space:nowrap}
.linea.total{font-size:1.15rem;color:var(--cy);border-bottom:2px solid var(--ln)}
.linea.pasado{color:var(--bad)}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reqs li{padding-left:30px;position:relative}
.reqs li::before{content:"?";position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:.75rem;color:var(--mu)}
.reqs li.ok::before{content:"✓";border-color:var(--ok);color:var(--ok)}
.reqs li.no{color:var(--bad)}
.reqs li.no::before{content:"✗";border-color:var(--bad);color:var(--bad)}
@media(max-width:820px){.build{grid-template-columns:1fr}.resumen{position:static}}

/* Retroalimentación */
.fb{display:none;margin-top:14px;border-radius:12px;padding:14px 18px;font-size:1.1rem;border:2px solid}
.fb.show{display:block}
.fb.bien{border-color:var(--ok);background:rgba(56,245,154,.08)}
.fb.mal{border-color:var(--bad);background:rgba(255,84,112,.08)}
.fb.fin{border-color:var(--am);background:rgba(255,209,102,.08)}
.fb.info{border-color:var(--vi);background:rgba(157,107,255,.08)}
.fb b{font-family:'Orbitron',sans-serif;font-size:.88rem}
.pista{color:var(--am)}
.sol{display:block;margin:6px 0;color:var(--am);font-weight:700}
.intentos{color:var(--mu);font-weight:600;margin-right:auto}

/* Bloqueo por salir de la actividad */
#bloqueo{position:fixed;inset:0;z-index:50;background:rgba(4,4,14,.95);display:grid;place-items:center;padding:20px}
.bloq-card{max-width:520px;width:100%;background:var(--p1);border:2px solid var(--bad);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 0 30px rgba(255,84,112,.35)}
.bloq-ico{width:64px;height:64px;border-radius:50%;border:3px solid var(--bad);color:var(--bad);display:grid;place-items:center;margin:0 auto 12px;font-family:'Orbitron',sans-serif;font-weight:900;font-size:2rem}
.bloq-card h2{color:var(--bad);font-size:1.15rem;margin-bottom:10px}
.bloq-card p{font-size:1.12rem;margin:.5em 0}
.bloq-card input{margin:12px 0 4px;text-align:center;font-family:'Orbitron',sans-serif}
.bloq-msg{color:var(--am);min-height:1.4em}
.hud-sal{font-weight:700;color:var(--mu);font-size:.9rem}
.hud-sal.alerta{color:var(--bad)}
.aviso{color:var(--am);font-weight:600;font-size:1.02rem !important}

/* Tienda de notas */
.lista-precios{margin-bottom:22px}
.precios{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.precio-nota{background:var(--p1);border:2px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center;opacity:.5}
.precio-nota b{display:block;font-family:'Orbitron',sans-serif;font-size:1.3rem;color:var(--tx)}
.precio-nota span{font-size:.92rem;color:var(--am);font-weight:700}
.precio-nota.alcanza{opacity:1;border-color:var(--cy)}
.precio-nota.mejor{border-color:var(--mg);box-shadow:0 0 16px rgba(255,43,214,.45)}
.precios-nota{color:var(--mu);margin:0;font-size:1.02rem}
@media(max-width:520px){.precios{grid-template-columns:repeat(3,1fr)}}

/* Cierre y certificado */
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.stat{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;min-width:170px}
.stat b{display:block;font-family:'Orbitron',sans-serif;font-size:1.4rem;color:var(--cy)}
.stat span{color:var(--mu);font-size:.98rem}
.cert{background:var(--p1);border:2px solid var(--vi);border-radius:20px;padding:28px 22px;text-align:center;max-width:780px;margin:10px auto}
.cert h1{font-size:1.15rem;color:var(--mg)}
.cert .nombre{font-family:'Orbitron',sans-serif;font-size:1.3rem;margin:14px 0 2px}
.cert .nota{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3.5rem,14vw,6rem);line-height:1;color:var(--cy);text-shadow:0 0 22px rgba(0,229,255,.6);margin:16px 0 6px}
.cert .rango{font-family:'Orbitron',sans-serif;color:var(--am);font-size:1.05rem}
.cert .stats{justify-content:center}
.tabla-wrap{overflow-x:auto;margin-top:18px}
.tabla{width:100%;border-collapse:collapse;text-align:left}
.tabla th,.tabla td{padding:8px 10px;border-bottom:1px solid var(--ln)}
.tabla th{color:var(--mu);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   CONFIGURACIÓN
   Pega entre las comillas la URL /exec del Apps Script.
   Si se deja vacía, el OVA funciona en modo demo:
   usuario demo, contraseña 1234 (no guarda en la hoja).
   El usuario demo funciona SIEMPRE, también con la hoja conectada,
   para que la profe pueda revisar el OVA sin afectar resultados.
   ========================================================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBAVtUuC689W5nIWD4A6ljNFJnlrYz3keU8RlAuWZBmungcDvfyodnhH9XcslyEJjnVQ/exec';
const PTS = [50000, 30000, 15000];   // salario (pesos) por resolver un reto en el 1.º, 2.º o 3.er intento

/* ---------- Vigilancia: cambiar de pestaña, minimizar u otra ventana ---------- */
const VIG = {
  activa: true,          // false = desactiva toda la vigilancia
  penalMonedas: 50000,   // pesos que se descuentan del salario por cada salida
  segundosMinimos: 2,    // salidas más cortas que esto no cuentan
  esperaSeg: 10,         // segundos que queda bloqueado al volver
  maxSalidas: 5,         // con esta cantidad de salidas la actividad se bloquea
  claveProfe: '7319'     // clave para desbloquear (cámbiala)
};

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n).toLocaleString('es-CO');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Íconos ---------- */
const SV = 'viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const ICON = {
  torre:`<svg ${SV}><rect x="18" y="4" width="28" height="56" rx="4"/><line x1="24" y1="14" x2="40" y2="14"/><line x1="24" y1="20" x2="40" y2="20"/><circle cx="32" cy="42" r="6"/><circle cx="32" cy="42" r="2"/><line x1="24" y1="54" x2="28" y2="54"/></svg>`,

/* ---------- Azar con semilla: cada estudiante siempre ve SU versión ---------- */
function hashTxt(s){ let h = 2166136261; for (const c of String(s)){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngDe(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function personalizar(semilla){
  MIS.forEach((m, mi) => {
    const rnd = rngDe(hashTxt(semilla + '|m' + mi)), orden = m.retos.slice();
    for (let i = orden.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [orden[i], orden[j]] = [orden[j], orden[i]]; }
    m.retos = orden.map(r => {
      if (!r.var) return r;
      const k = Math.floor(rngDe(hashTxt(semilla + '|' + r.id))() * (r.var.length + 1));
      return k === 0 ? r : Object.assign({}, r, r.var[k - 1]);
    });
  });
}

function notaComprable(sal){
  const t = NOTAS.find(x => sal >= x.precio);
  if (t) return t.n;
  return Math.min(2.9, Math.round((1 + 1.9 * sal / NOTAS[NOTAS.length - 1].precio) * 10) / 10);   // no alcanza: de 1,0 a 2,9
}

let AC = null;
function tono(f, d = .12, tipo = 'sine', v = .08, delay = 0){
  if (!S.sonido) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}

}

}
async function guardar(){
  if (S.demo){ setSave('demo'); return; }
  if (S.saving){ S.again = true; return; }
  clearTimeout(S.retryT);
  S.saving = true; setSave('saving');
  const ver = S.ver, env = S.pend.slice();
  try {
    const r = await api({ accion:'guardar', usuario:S.user, clave:S.clave, estado:{v:1, res:S.res, tries:S.tries, faltas:S.faltas, racha:S.racha, penal:S.penal, bloq:S.bloq}, resumen:resumen(), eventos:env });
    if (!r || !r.ok) throw new Error((r && r.error) || 'Respuesta inválida');
    S.pend.splice(0, env.length); S.savedVer = ver; setSave('ok');
  } catch (e) {
    setSave('error'); S.retryT = setTimeout(guardar, 10000);
  } finally {
    S.saving = false;
    if (S.again){ S.again = false; guardar(); }
  }
}

  bindHud();

  $$('.estante[data-mi]').forEach(b => b.onclick = () => abrirMision(+b.dataset.mi));
}
function estante(m, mi){
  const hechos = m.retos.filter(r => S.res[r.id]).length, tot = m.retos.length;
  const est = hechos === tot ? 'hecha' : (abierta(mi) ? 'abierta' : 'cerrada');
  const lbl = est === 'hecha' ? 'Completada' : est === 'abierta' ? (hechos ? `En curso: ${hechos} de ${tot}` : `${tot} retos`) : 'Se abre al terminar la anterior';
  return `<button class="estante ${est}" ${est !== 'cerrada' ? `data-mi="${mi}"` : 'disabled'} aria-label="Misión ${mi + 1}: ${esc(m.titulo)}. ${lbl}">
    <span class="est-n">Misión ${mi + 1}</span><span class="est-ico">${ICON[m.icono]}</span>
    <span class="est-t">${esc(m.titulo)}</span><span class="est-c">Cliente: ${esc(m.cli.nombre)}</span>
    <span class="est-bar"><i style="width:${hechos / tot * 100}%"></i></span><span class="est-l">${lbl}</span></button>`;
}

/* ---------- Misión ---------- */
function abrirMision(mi){
  if (!abierta(mi)) return;
  const m = MIS[mi], ri = m.retos.findIndex(r => !S.res[r.id]);
  if (ri === -1) return renderCierre(mi);
  if (ri === 0 && !S.tries[m.retos[0].id]) return renderIntro(mi);
  renderReto(mi, ri);
}
function dotsHtml(mi, ri){
  return MIS[mi].retos.map((r, i) => { const x = S.res[r.id]; return `<i class="dot ${x ? (x.ok ? 'ok' : 'mal') : (i === ri ? 'cur' : '')}"></i>`; }).join('');
}
function barMision(mi, ri, conManual){
  return `<div class="mbar"><button class="link" id="btnTienda">Volver a la tienda</button>
    <div class="mbar-t"><span>Misión ${mi + 1}</span><b>${esc(MIS[mi].titulo)}</b></div>
    <div class="dots" aria-hidden="true">${dotsHtml(mi, ri)}</div>
    ${conManual ? '<button class="link" id="btnManual">Repasar manual</button>' : ''}</div>`;
}
function bindBar(){ const b = $('#btnTienda'); if (b) b.onclick = renderHub; }

function renderIntro(mi){
  const m = MIS[mi];
  pantalla(hud() + `<main class="wrap">${barMision(mi, -1)}
    <section class="escena"><div>${avatar(m.cli)}</div>
      <div class="burbuja"><div class="quien">${esc(m.cli.nombre)}, ${esc(m.cli.rol)}</div><p>${m.pedido}</p></div></section>
    <div class="acciones"><button class="btn pri" id="go">Abrir el manual del técnico</button></div></main>`);
  bindHud(); bindBar();
  $('#go').onclick = () => renderManual(mi, 0, null);
  $('#go').focus();
}

function renderManual(mi, p, volverA){
  const m = MIS[mi], pg = m.manual[p], last = m.manual.length - 1;
  const sig = p < last ? 'Página siguiente' : (volverA != null ? 'Volver al reto' : `Atender a ${m.cli.nombre}`);
  pantalla(hud() + `<main class="wrap">${barMision(mi, -1)}
    <article class="manual">
      <div class="man-head"><span class="man-ico">${ICON[pg.fig || m.icono]}</span>
        <div><div class="man-pag">Manual del técnico, página ${p + 1} de ${m.manual.length}</div><h2>${pg.t}</h2></div></div>
      ${(pg.p || []).map(x => `<p>${x}</p>`).join('')}
      ${pg.fichas ? `<dl class="fichas">${pg.fichas.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>` : ''}
    </article>
    <div class="acciones"><button class="btn" id="ant" ${p === 0 ? 'disabled' : ''}>Página anterior</button><button class="btn pri" id="sig">${esc(sig)}</button></div></main>`);
  bindHud(); bindBar();
  $('#ant').onclick = () => renderManual(mi, p - 1, volverA);
  $('#sig').onclick = () => {
    if (p < last) return renderManual(mi, p + 1, volverA);
    const ri = volverA != null ? volverA : m.retos.findIndex(r => !S.res[r.id]);
    renderReto(mi, ri < 0 ? 0 : ri);
  };
  $('#sig').focus();
}

/* ---------- Reto ---------- */
function renderReto(mi, ri){
  const m = MIS[mi], r = m.retos[ri];
  R = { mi, ri, r, done:false, int:S.tries[r.id] || 0, check:null, retry:null, reveal:null };
  const quien = r.cli || m.cli;
  pantalla(hud() + `<main class="wrap">${barMision(mi, ri, true)}
    <section>
      <div class="reto-head"><div>${avatar(quien)}</div>
        <div class="burbuja"><div class="quien">Reto ${ri + 1} de ${m.retos.length}. ${esc(quien.nombre)}</div><p>${r.q}</p></div></div>
      <div id="zona" class="zona"></div>
      <div id="fb" class="fb" role="status" aria-live="polite"></div>
      <div class="acciones"><span class="intentos" id="intentos"></span>
        <button class="btn pri" id="btnRev">${r.tipo === 'build' ? 'Entregar pedido' : 'Revisar'}</button></div>
    </section></main>`);
  bindHud(); bindBar();
  $('#btnManual').onclick = () => renderManual(mi, 0, ri);
  TIPOS[r.tipo]($('#zona'), r);
  pintaIntentos();
  $('#btnRev').onclick = revisar;
}
function pintaIntentos(){
  const e = $('#intentos'); if (!e) return;
  if (R.done){ e.textContent = ''; return; }
  const q = 3 - R.int;
  e.textContent = R.int === 0 ? `Si lo resuelves al primer intento te pagan ${money(PTS[0])}` : `Te ${q === 1 ? 'queda 1 intento' : `quedan ${q} intentos`}`;
}
function fb(cls, html){ const e = $('#fb'); e.className = 'fb show ' + cls; e.innerHTML = html; }
function info(t){ fb('info', esc(t)); }

function revisar(){
  if (!R || R.done) return;
  const out = R.check();
  if (!out) return;
  R.int++; S.tries[R.r.id] = R.int;
  if (out.ok) return terminar(true);
  if (R.int >= 3){ if (R.reveal) R.reveal(); return terminar(false); }
  SFX.bad();
  const q = 3 - R.int;
  fb('mal', `<b>Todavía no.</b> ${out.msg ? esc(out.msg) + ' ' : ''}Te ${q === 1 ? 'queda 1 intento' : `quedan ${q} intentos`}.<br><span class="pista">Pista: ${R.r.pista}</span>`);
  pintaIntentos();
  if (R.retry) R.retry();
}

function solucion(r){
  switch (r.tipo){
    case 'mcq': return r.ops[r.ok];
    case 'match': return r.pares.map(([a, b]) => `${a}: ${b}`).join('. ');
    case 'order': return r.items.join(', ');
    case 'clasif': return r.cats.map((c, ci) => `${c}: ${r.items.filter(x => x[1] === ci).map(x => x[0]).join(', ')}`).join('. ');
    case 'num': return `${String(r.ok).replace('.', ',')} ${r.unidad}`;
    case 'build': return r.sol;
  }
  return '';
}

function terminar(ok){
  R.done = true;
  const pts = ok ? PTS[R.int - 1] : 0, m = MIS[R.mi], last = R.ri === m.retos.length - 1;
  S.res[R.r.id] = { ok, i:R.int, p:pts };
  $$('#zona button, #zona input').forEach(b => { b.disabled = true; });
  if (ok){ SFX.ok(); fb('bien', `<b>¡Cliente feliz! Te pagaron ${money(pts)}.</b> ${R.r.exp}`); }
  else { SFX.bad(); fb('fin', `<b>Este trabajo no se pagó, pero aprendiste algo.</b><span class="sol">La respuesta: ${solucion(R.r)}</span>${R.r.exp}`); }
  $('#coins').textContent = money(monedas());
  $('.dots').innerHTML = dotsHtml(R.mi, -1);
  pintaIntentos();
  S.pend.push({ mision:`M${R.mi + 1} ${m.titulo}`, reto:R.ri + 1, resultado: ok ? 'Correcto' : 'Incorrecto', intentos:R.int, monedas:pts, fecha:new Date().toISOString() });
  S.ver++; guardar();
  const b = $('#btnRev');
  b.textContent = last ? 'Terminar misión' : 'Siguiente reto';
  const mi = R.mi, ri = R.ri;
  b.onclick = () => last ? renderCierre(mi) : renderReto(mi, ri + 1);
  b.focus();
}

/* ---------- Tipos de reto ---------- */
const COL = ['#00e5ff', '#ff2bd6', '#ffd166', '#38f59a', '#9d6bff', '#ff8a3d'];
const TIPOS = {
  mcq(z, r){
    const orden = r.ops.length > 2 ? shuffle(r.ops.map((_, i) => i)) : r.ops.map((_, i) => i);
    let sel = null;
    z.innerHTML = `<div class="ops">${orden.map(i => `<button class="op" data-i="${i}">${r.ops[i]}</button>`).join('')}</div>`;
    $$('.op', z).forEach(b => b.onclick = () => {
      if (R.done) return; SFX.tap();
      $$('.op', z).forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.i;
    });
    R.check = () => {
      if (sel === null){ info('Elige una opción antes de revisar.'); return null; }
      const b = $(`.op[data-i="${sel}"]`, z);
      if (sel === r.ok){ b.classList.add('bien'); return { ok:true }; }
      b.classList.remove('sel'); b.classList.add('mal'); b.disabled = true; sel = null;
      return { ok:false };
    };
    R.reveal = () => $(`.op[data-i="${r.ok}"]`, z).classList.add('bien');
  },

  match(z, r){
    const n = r.pares.length, der = shuffle(r.pares.map((_, i) => i)), pair = {}, fijo = new Set();
    let selL = 0;
    z.innerHTML = `<p class="ayuda">Toca un elemento de la izquierda y luego su pareja de la derecha. Para deshacer una pareja, tócala otra vez.</p>
      <div class="match"><div class="col">${r.pares.map((p, i) => `<button class="mi" data-l="${i}"><span class="tag"></span>${p[0]}</button>`).join('')}</div>
      <div class="col">${der.map(j => `<button class="mi" data-r="${j}"><span class="tag"></span>${r.pares[j][1]}</button>`).join('')}</div></div>`;
    const libre = () => { for (let i = 0; i < n; i++) if (pair[i] == null && !fijo.has(i)) return i; return null; };
    function pintar(){
      const inv = {}; Object.keys(pair).forEach(i => { inv[pair[i]] = +i; });
      $$('[data-l]', z).forEach(b => {
        const i = +b.dataset.l, has = pair[i] != null;
        b.classList.toggle('sel', selL === i && !has); b.classList.toggle('par', has); b.classList.toggle('bien', fijo.has(i));
        b.style.setProperty('--c', COL[i % COL.length]); b.querySelector('.tag').textContent = i + 1;
        b.setAttribute('aria-pressed', selL === i && !has);
      });
      $$('[data-r]', z).forEach(b => {
        const j = +b.dataset.r, i = inv[j], has = i != null;
        b.classList.toggle('par', has); b.classList.toggle('bien', has && fijo.has(i));
        b.style.setProperty('--c', has ? COL[i % COL.length] : 'transparent'); b.querySelector('.tag').textContent = has ? i + 1 : '';
      });
    }
    $$('[data-l]', z).forEach(b => b.onclick = () => {
      if (R.done) return; const i = +b.dataset.l; if (fijo.has(i)) return; SFX.tap();
      if (pair[i] != null) delete pair[i];
      selL = i;
      pintar();
    });
    $$('[data-r]', z).forEach(b => b.onclick = () => {
      if (R.done) return; const j = +b.dataset.r;
      const dueno = Object.keys(pair).find(k => pair[k] === j);
      if (dueno != null){ if (fijo.has(+dueno)) return; delete pair[dueno]; selL = +dueno; SFX.tap(); pintar(); return; }
      if (selL === null || pair[selL] != null){ info('Primero toca un elemento de la izquierda.'); return; }
      pair[selL] = j; SFX.tap(); selL = libre(); pintar();
    });
    pintar();
    R.check = () => {
      if (Object.keys(pair).length < n){ info('Une todas las parejas antes de revisar.'); return null; }
      let bien = 0;
      Object.keys(pair).forEach(i => { if (pair[i] === +i){ fijo.add(+i); bien++; } });
      if (bien === n){ pintar(); return { ok:true }; }
      Object.keys(pair).forEach(i => { if (!fijo.has(+i)) delete pair[i]; });
      selL = libre(); pintar();
      return { ok:false, msg:`Tienes ${bien} de ${n} parejas bien; las correctas quedaron fijas.` };
    };
    R.reveal = () => { for (let i = 0; i < n; i++){ pair[i] = i; fijo.add(i); } selL = null; pintar(); };
  },

  order(z, r){
    const n = r.items.length, slots = Array(n).fill(null), fijo = new Set();
    let pool = shuffle(r.items.map((_, i) => i));
    if (pool.every((v, i) => v === i)) pool.reverse();
    function pintar(){
      z.innerHTML = `<p class="ayuda">Toca los elementos en orden, empezando por el primero. Para quitar uno, tócalo en su casilla.</p>
        <ol class="slots">${slots.map((v, k) => `<li><button class="slot ${v == null ? 'vacio' : ''} ${fijo.has(k) ? 'bien' : ''}" data-s="${k}" aria-label="Casilla ${k + 1}: ${v == null ? 'vacía' : esc(r.items[v])}"><span class="sn">${k + 1}</span>${v == null ? '' : r.items[v]}</button></li>`).join('')}</ol>
        <div class="pool">${pool.map(v => `<button class="chip" data-v="${v}">${r.items[v]}</button>`).join('')}</div>`;
      $$('.chip', z).forEach(b => b.onclick = () => {
        if (R.done) return; const v = +b.dataset.v, k = slots.findIndex(x => x == null); if (k < 0) return;
        SFX.tap(); slots[k] = v; pool = pool.filter(x => x !== v); pintar();
        const sig = $('.chip', z) || $('#btnRev'); if (sig) sig.focus();
      });
      $$('.slot', z).forEach(b => b.onclick = () => {
        if (R.done) return; const k = +b.dataset.s; if (fijo.has(k) || slots[k] == null) return;
        SFX.tap(); pool.push(slots[k]); slots[k] = null; pintar();
      });
    }
    pintar();
    R.check = () => {
      if (slots.some(x => x == null)){ info('Ubica todos los elementos antes de revisar.'); return null; }
      let bien = 0;
      slots.forEach((v, k) => { if (v === k){ fijo.add(k); bien++; } });
      if (bien === n){ pintar(); return { ok:true }; }
      slots.forEach((v, k) => { if (!fijo.has(k)){ pool.push(v); slots[k] = null; } });
      pintar();
      return { ok:false, msg:`${bien} de ${n} quedaron en su lugar y se quedan fijos.` };
    };
    R.reveal = () => { for (let k = 0; k < n; k++){ slots[k] = k; fijo.add(k); } pool = []; pintar(); };
  },

  clasif(z, r){
    const n = r.items.length, orden = shuffle(r.items.map((_, i) => i)), resp = {}, fijo = new Set(), mal = new Set();
    z.innerHTML = `<div class="clasif">${orden.map(i => `<div class="fila" data-f="${i}"><span class="fila-t">${r.items[i][0]}</span>
      <span class="seg" role="group" aria-label="${esc(r.items[i][0])}">${r.cats.map((c, ci) => `<button data-i="${i}" data-c="${ci}" aria-pressed="false">${c}</button>`).join('')}</span></div>`).join('')}</div>`;
    function pintar(){
      $$('.fila', z).forEach(f => {
        const i = +f.dataset.f;
        f.classList.toggle('bien', fijo.has(i)); f.classList.toggle('mal', mal.has(i));
        $$('button', f).forEach(b => { const s = resp[i] === +b.dataset.c; b.classList.toggle('sel', s); b.setAttribute('aria-pressed', s); });
      });
    }
    $$('.seg button', z).forEach(b => b.onclick = () => {
      if (R.done) return; const i = +b.dataset.i; if (fijo.has(i)) return;
      SFX.tap(); resp[i] = +b.dataset.c; mal.delete(i); pintar();
    });
    R.check = () => {
      if (Object.keys(resp).length < n){ info('Clasifica todos los elementos antes de revisar.'); return null; }
      let bien = 0;
      for (let i = 0; i < n; i++){ if (resp[i] === r.items[i][1]){ fijo.add(i); bien++; } else { mal.add(i); } }
      if (bien === n){ pintar(); return { ok:true }; }
      for (let i = 0; i < n; i++) if (!fijo.has(i)) delete resp[i];
      pintar();
      return { ok:false, msg:`${bien} de ${n} están bien. Revisa los que quedaron en rojo.` };
    };
    R.reveal = () => { for (let i = 0; i < n; i++){ resp[i] = r.items[i][1]; fijo.add(i); } mal.clear(); pintar(); };
  },

  num(z, r){
    z.innerHTML = `<label class="num"><input id="numIn" type="text" inputmode="decimal" autocomplete="off" aria-label="Tu respuesta"><span>${r.unidad}</span></label>`;
    const inp = $('#numIn', z);
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); revisar(); } };
    inp.oninput = () => inp.classList.remove('mal');
    inp.focus();
    R.check = () => {
      const v = inp.value.trim().replace(/\s/g, '').replace(',', '.');
      if (v === '' || isNaN(Number(v))){ info('Escribe un número antes de revisar (puedes usar coma para los decimales).'); return null; }
      if (Math.abs(Number(v) - r.ok) <= (r.tol || 0)){ inp.classList.add('bien'); return { ok:true }; }
      inp.classList.add('mal'); return { ok:false };
    };
    R.retry = () => inp.select();
    R.reveal = () => { inp.value = String(r.ok).replace('.', ','); inp.classList.remove('mal'); inp.classList.add('bien'); };
  },

  build(z, r){
    const GR = r.grupos, sel = {};
    GR.forEach(([k]) => { sel[k] = null; });
    let estReq = null;
    const total = () => r.base + GR.reduce((s, [k]) => s + (sel[k] != null ? CAT[k][sel[k]].p : 0), 0);
    const piezas = () => { const s = { total:total() }; GR.forEach(([k]) => { s[k] = CAT[k][sel[k]]; }); return s; };
    function pintar(){
      const t = total(), sobra = r.presupuesto - t;
      z.innerHTML = `<div class="build">
        <div>${GR.map(([k, lab]) => `<fieldset class="grupo"><legend>${lab}</legend><div class="cards">${CAT[k].map((o, i) =>
          `<button class="pieza ${sel[k] === i ? 'sel' : ''}" data-k="${k}" data-i="${i}" aria-pressed="${sel[k] === i}"><b>${o.n}</b>${o.d ? `<small>${o.d}</small>` : ''}<span class="precio">${money(o.p)}</span></button>`).join('')}</div></fieldset>`).join('')}</div>
        <aside class="resumen" aria-live="polite"><h3>Orden de trabajo</h3>
          <div class="linea"><span>${r.baseTxt}</span><b>${money(r.base)}</b></div>
          ${GR.map(([k, lab]) => `<div class="linea"><span>${lab}: ${sel[k] != null ? CAT[k][sel[k]].n : 'sin elegir'}</span><b>${sel[k] != null ? money(CAT[k][sel[k]].p) : '—'}</b></div>`).join('')}
          <div class="linea total ${sobra < 0 ? 'pasado' : ''}"><span>Total</span><b>${money(t)}</b></div>
          <div class="linea"><span>Presupuesto del cliente</span><b>${money(r.presupuesto)}</b></div>
          <div class="linea ${sobra < 0 ? 'pasado' : ''}"><span>${sobra < 0 ? 'Te pasaste por' : 'Le sobra'}</span><b>${money(Math.abs(sobra))}</b></div>
          <h4>Lo que pide ${esc(r.cli.nombre)}</h4>
          <ul class="reqs">${r.reqs.map((q, qi) => `<li class="${estReq ? (estReq[qi] ? 'ok' : 'no') : ''}">${q.t}</li>`).join('')}</ul>
        </aside></div>`;
      $$('.pieza', z).forEach(b => b.onclick = () => {
        if (R.done) return; SFX.tap(); sel[b.dataset.k] = +b.dataset.i; estReq = null; pintar();
        const f = $(`.pieza[data-k="${b.dataset.k}"][data-i="${b.dataset.i}"]`, z); if (f) f.focus();
      });
    }
    pintar();
    R.check = () => {
      if (GR.some(([k]) => sel[k] == null)){ info('Elige una opción en cada sección del catálogo antes de entregar.'); return null; }
      const s = piezas(); estReq = r.reqs.map(q => q.f(s)); pintar();
      const b = estReq.filter(Boolean).length;
      return b === r.reqs.length ? { ok:true } : { ok:false, msg:`El pedido cumple ${b} de ${r.reqs.length} cosas que pidió ${r.cli.nombre}. Mira la lista en la orden de trabajo.` };
    };
    R.reveal = () => { Object.assign(sel, r.solSel); const s = piezas(); estReq = r.reqs.map(q => q.f(s)); pintar(); };
  }
};

/* ---------- Fin de misión ---------- */
function renderCierre(mi){
  const m = MIS[mi], max = m.retos.length * PTS[0];
  const pts = m.retos.reduce((s, r) => s + ((S.res[r.id] || {}).p || 0), 0);
  const bien = m.retos.filter(r => (S.res[r.id] || {}).ok).length;
  const ultima = mi === MIS.length - 1, todo = !posActual();
  pantalla(hud() + `<main class="wrap">${barMision(mi, -1)}
    <section class="escena"><div>${avatar(m.cli)}</div>
      <div class="burbuja"><div class="quien">${esc(m.cli.nombre)}</div><p>${m.gracias}</p></div></section>
    <div class="stats">
      <div class="stat"><b>${bien} de ${m.retos.length}</b><span>retos resueltos bien</span></div>
      <div class="stat"><b>${money(pts)}</b><span>ganados de ${money(max)} posibles</span></div>
    </div>
    <div class="acciones">
      <button class="btn" id="btnVolver">Volver a la tienda</button>
      ${ultima || todo ? '<button class="btn pri" id="btnFinal">Ver mi resultado final</button>' : `<button class="btn pri" id="btnSig">Siguiente misión: ${esc(MIS[mi + 1].titulo)}</button>`}
    </div></main>`);
  bindHud(); bindBar();
  SFX.win();
  $('#btnVolver').onclick = renderHub;
  const f = $('#btnFinal'), s = $('#btnSig');
  if (f){ f.onclick = renderFinal; f.focus(); }
  if (s){ s.onclick = () => abrirMision(mi + 1); s.focus(); }
}

/* ---------- Resultado final ---------- */
function renderFinal(){
  const sal = monedas(), n = nota(), t = NOTAS.find(x => x.n === n);
  pantalla(hud() + `<main class="wrap">
    <section class="cert">
      <h1>Tienda de notas</h1>
      <p style="color:var(--mu)">${esc(S.nombre)}, terminaste tu contrato en TecnoTienda Pro. Con tu salario puedes comprar la mejor nota que te alcance.</p>
      <div class="stats">
        <div class="stat"><b>${money(ganadas())}</b><span>salario ganado</span></div>
        ${S.penal ? `<div class="stat"><b>−${money(S.penal)}</b><span>descuentos por ${S.faltas} ${S.faltas === 1 ? 'salida' : 'salidas'}</span></div>` : ''}
        <div class="stat"><b>${money(sal)}</b><span>disponible para comprar</span></div>
      </div>
      <div class="precios">${NOTAS.map(x => `<div class="precio-nota ${sal >= x.precio ? 'alcanza' : ''} ${t && x.n === n ? 'mejor' : ''}"><b>${fmtNota(x.n)}</b><span>${money(x.precio)}</span></div>`).join('')}</div>
      <div id="compra" class="acciones" style="justify-content:center">${t
        ? `<button class="btn pri" id="btnComprar">Comprar mi ${fmtNota(n)} por ${money(t.precio)}</button>`
        : `<p class="aviso">Tu salario no alcanza para el 3,0, que cuesta ${money(NOTAS[NOTAS.length - 1].precio)}.</p><button class="btn pri" id="btnComprar">Ver mi nota</button>`}</div>
      <div id="factura"></div>
    </section>
    <div class="acciones" style="justify-content:center"><button class="btn" id="btnVolver">Volver a la tienda</button></div></main>`);
  bindHud();
  $('#btnVolver').onclick = renderHub;
  $('#btnComprar').onclick = () => {
    SFX.win();
    $('#compra').remove();
    $('#factura').innerHTML = `
      <div class="nombre">${esc(S.nombre)}</div><div style="color:var(--mu)">${esc(S.curso)}</div>
      <div class="nota" aria-label="Nota ${notaTxt()}">${notaTxt()}</div>
      <div class="rango">${t ? 'Nota comprada. ' : 'No alcanzó para aprobar. '}${rango(n)}</div>
      ${t ? `<p style="color:var(--mu)">Pagaste ${money(t.precio)}. Te sobran ${money(sal - t.precio)}.</p>` : ''}
      <div class="stats"><div class="stat"><b>${correctos()} de ${TOTAL}</b><span>retos resueltos bien</span></div></div>
      <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Misión</th><th>Bien</th><th>Salario</th></tr></thead><tbody>
        ${MIS.map((m, mi) => `<tr><td>${mi + 1}. ${esc(m.titulo)}</td><td>${m.retos.filter(r => (S.res[r.id] || {}).ok).length} de ${m.retos.length}</td><td>${money(m.retos.reduce((s2, r) => s2 + ((S.res[r.id] || {}).p || 0), 0))}</td></tr>`).join('')}
      </tbody></table></div>`;
  };
}

/* ---------- Vigilancia ---------- */
let lejos = null;
const vigilando = () => VIG.activa && !!S.user && !S.pausaVig && posActual() !== null;
function seFue(){ if (lejos === null && vigilando()) lejos = Date.now(); }
function volvio(){
  if (lejos === null || document.visibilityState !== 'visible' || !document.hasFocus()) return;
  const seg = (Date.now() - lejos) / 1000; lejos = null;
  if (seg >= VIG.segundosMinimos && vigilando()) registrarSalida(seg);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) seFue(); else volvio(); });
window.addEventListener('blur', seFue);
window.addEventListener('focus', volvio);

function registrarSalida(seg){
  S.faltas++; S.racha++; S.penal += VIG.penalMonedas;
  if (S.racha >= VIG.maxSalidas) S.bloq = true;
  S.pend.push({ mision:'Vigilancia', reto:'', resultado:`Salió de la actividad (${Math.round(seg)} s)${S.bloq ? ' y quedó bloqueada' : ''}`, intentos:S.faltas, monedas:-VIG.penalMonedas, fecha:new Date().toISOString() });
  S.ver++; guardar();
  const c = $('#coins'); if (c) c.textContent = money(monedas());
  const h = $('#hudSal'); if (h){ h.textContent = `Salidas: ${S.faltas}`; h.classList.add('alerta'); }
  SFX.bad();
  mostrarBloqueo(seg);
}

function mostrarBloqueo(seg){
  let o = $('#bloqueo');
  if (!o){ o = document.createElement('div'); o.id = 'bloqueo'; o.setAttribute('role', 'alertdialog'); o.setAttribute('aria-modal', 'true'); document.body.appendChild(o); }
  clearInterval(S.bloqT);
  if (S.bloq){
    o.innerHTML = `<div class="bloq-card"><div class="bloq-ico">!</div><h2>Actividad bloqueada</h2>
      <p>Saliste de la actividad ${S.faltas} ${S.faltas === 1 ? 'vez' : 'veces'}. Quedó registrado en la hoja de la profe.</p>
      <p>Llama a la profe para que la desbloquee.</p>
      <input id="clProfe" type="password" inputmode="numeric" autocomplete="off" aria-label="Clave de la profe" placeholder="Clave de la profe">
      <p class="bloq-msg" id="bmsg" role="status"></p>
      <button class="btn pri" id="btnDesb">Desbloquear</button></div>`;
    const inp = $('#clProfe'), ok = () => {
      if (inp.value.trim() !== VIG.claveProfe){ $('#bmsg').textContent = 'Clave incorrecta.'; inp.select(); return; }
      S.bloq = false; S.racha = 0;
      S.pend.push({ mision:'Vigilancia', reto:'', resultado:'Desbloqueada por la profe', intentos:S.faltas, monedas:0, fecha:new Date().toISOString() });
      S.ver++; guardar(); o.remove();
    };
    $('#btnDesb').onclick = ok;
    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); ok(); } };
    inp.focus();
    return;
  }
  let t = VIG.esperaSeg;
  o.innerHTML = `<div class="bloq-card"><div class="bloq-ico">!</div><h2>Saliste de la actividad</h2>
    <p>Estuviste fuera ${Math.round(seg)} segundos. Quedó registrado en la hoja de la profe y te descontaron <b>${money(VIG.penalMonedas)}</b> del salario.</p>
    <p>Salidas: <b>${S.racha} de ${VIG.maxSalidas}</b>. Al llegar a ${VIG.maxSalidas}, la actividad se bloquea.</p>
    <button class="btn pri" id="btnVolverAct" disabled>Podrás seguir en ${t} s</button></div>`;
  const b = $('#btnVolverAct');
  S.bloqT = setInterval(() => {
    t--;
    if (t > 0){ b.textContent = `Podrás seguir en ${t} s`; return; }
    clearInterval(S.bloqT); b.disabled = false; b.textContent = 'Volver a la actividad'; b.focus();
  }, 1000);
  b.onclick = () => o.remove();
}

renderLogin();
</script>
</body>
